<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FindMe — festival band</title>
<!-- Page shell only. Each block below names the folder in src/ that owns it; CLAUDE.md has the full map. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Six+Caps&family=Inter:wght@400;500;600;700&family=Unbounded:wght@500;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/core/base.css">
<link rel="stylesheet" href="src/header/header.css">
<link rel="stylesheet" href="src/story/story.css">
<link rel="stylesheet" href="src/scene/scene.css">
<link rel="stylesheet" href="src/hero/hero.css">
<link rel="stylesheet" href="src/band/band.css">
<link rel="stylesheet" href="src/chapters/screen.css"><!-- each chapter's own <id>.css is added by src/chapters/chapters.js -->
<link rel="stylesheet" href="src/captions/captions.css">
<link rel="stylesheet" href="src/rail/rail.css">
<link rel="stylesheet" href="src/sections/how.css">
<link rel="stylesheet" href="src/sections/end.css">
<link rel="preload" href="frames/frames.json" as="fetch" crossorigin>
<script type="module" src="src/main.js"></script>
</head>
<body>
<!-- src/header: logo, language switch, scroll progress -->
<header class="top">
  <a class="logo" href="#story"><i></i>FindMe</a>
  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-l="ru" aria-pressed="false">RU</button>
    <button type="button" data-l="en" aria-pressed="false">EN</button>
    <button type="button" data-l="es" aria-pressed="false">ES</button>
  </div>
</header>
<div class="prog" id="prog"></div>

<!-- src/story: the scroll story. #story is tall; .stage sticks while it scrolls (timeline.js) -->
<section id="story">
  <div class="stage" id="stage">
    <!-- src/scene: light beams and horizon glow -->
    <div class="beams" id="beams"><i style="left:2%;--r0:10deg;--r1:22deg"></i><i class="c" style="right:2%;--r0:-10deg;--r1:-22deg"></i></div>
    <div class="horizon" id="horizon"></div>
    <!-- src/hero: wordmark, behind the band -->
    <h1 class="hero-t" id="heroT">FindMe</h1>

    <!-- src/band: the wristband. #frames = the Blender render for the current turn (frames/, made by blender/render.py);
         .face/.screen = the live HTML screen laid on the rendered glass in CSS 3D. Chapter screens (src/chapters) mount into #screen -->
    <div class="haloL" id="haloL"><div class="halo"></div></div>
    <div class="view">
      <div class="pos" id="pos">
        <div class="bz" id="bz">
          <canvas class="frames" id="frames" aria-label="FindMe wristband"></canvas>
          <div class="persp">
            <div class="watch" id="watch">
              <div class="face">
                <div class="screen" id="screen">
                  <i class="glass"></i>
                </div>
                <i class="shade"></i>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- src/scene: crowd silhouette (drawn in scene.js) and the phone-only bottom dim -->
    <svg class="crowd" id="crowd" viewBox="0 0 1000 160" preserveAspectRatio="xMidYMax slice" aria-hidden="true"></svg>
    <div class="dimB" id="dimB"></div>
    <!-- src/hero: tagline -->
    <div class="hero-f" id="heroF">
      <p class="tag" data-i="hero.tag"></p>
      <p class="sub" data-i="hero.sub"></p>
      <span class="hint" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></span>
    </div>
    <!-- src/rail: chapter dots (built from src/chapters/index.js) -->
    <nav class="rail" id="rail"></nav>
    <!-- src/captions: one caption per chapter (built from src/chapters/index.js) -->
    <div class="caps" id="caps"></div>
  </div>
</section>

<!-- src/sections/how: how it works -->
<section class="section how">
  <div class="wrap">
    <span class="kick" data-i="how.kick"></span>
    <h2 class="sec" data-i="how.title"></h2>
    <div class="hw">
      <div class="card"><span class="n">01</span><svg viewBox="0 0 44 44" aria-hidden="true"><circle cx="9" cy="33" r="5"/><circle cx="35" cy="33" r="5"/><circle cx="22" cy="10" r="5"/><path d="M12 28.5 19.5 14.5M24.5 14.5 32 28.5M14 33h16"/></svg><h3 data-i="how.t1"></h3><p data-i="how.b1"></p></div>
      <div class="card"><span class="n">02</span><svg viewBox="0 0 44 44" aria-hidden="true"><rect x="4" y="13" width="31" height="18" rx="5"/><path d="M39 19v6"/><rect x="9" y="18" width="14" height="8" rx="2" fill="#ff5a3c" stroke="none"/></svg><h3 data-i="how.t2"></h3><p data-i="how.b2"></p></div>
      <div class="card"><span class="n">03</span><svg viewBox="0 0 44 44" aria-hidden="true"><path d="M22 5c6.5 8.5 11 14 11 19.5a11 11 0 0 1-22 0C11 19 15.5 13.5 22 5z"/><path d="M17 26a5 5 0 0 0 5 5"/></svg><h3 data-i="how.t3"></h3><p data-i="how.b3"></p></div>
    </div>
  </div>
</section>

<!-- src/sections/end: slogan, the four strap colours, footer -->
<section class="section end">
  <span class="kick" data-i="end.kick"></span>
  <h2 data-i="end.title"></h2>
  <p data-i="end.body"></p>
  <ul class="cols">
    <li><i class="mini" style="--c:#ff5a3c"></i><span data-c="0"></span></li>
    <li><i class="mini" style="--c:#43d9ff"></i><span data-c="1"></span></li>
    <li><i class="mini" style="--c:#c6f24e"></i><span data-c="2"></span></li>
    <li><i class="mini" style="--c:#ffc23d"></i><span data-c="3"></span></li>
  </ul>
</section>
<footer><span class="flogo"><i></i>FindMe</span><span data-i="end.note"></span></footer>
</body>
</html>
