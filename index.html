<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tribu — festival band</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Unbounded:wght@500;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: a product launch on a festival night — confident, warm, few words.
   IDEA: the band itself is the presenter: it stands three-quarter, turns to you, then its screen walks through each feature.
   PICTURE: a WebGL wristband (polished silver case, round braided coral loop, light ring) with an HTML screen laid exactly on top; CSS 3D fallback.
   COLOUR and TYPE: warm black night, coral strap as the dominant colour, lagoon cyan for friends, sun yellow for places; Unbounded + Inter.
   LAYOUT: one sticky stage; phone = band on top, caption below; wide = caption left, band right; then how-it-works and the colour range. */
:root{color-scheme:dark;--bg:#0b0809;--ink:#f7efe8;--mute:#b5a79f;--coral:#ff5a3c;--cyan:#43d9ff;--lime:#c6f24e;--sun:#ffc23d;--ring:#ff5a3c;--k:1}
:root[data-theme=light],:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
.U,h1,h2,h3{font-family:Unbounded,Inter,system-ui,sans-serif}

.top{position:fixed;inset:0 0 auto;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:6px max(4vw,14px);background:linear-gradient(rgba(11,8,9,.92),rgba(11,8,9,0))}
.logo{display:flex;align-items:center;gap:10px;font:600 18px/1 Unbounded,Inter,sans-serif;color:var(--ink);text-decoration:none}
.logo i{width:18px;height:18px;border-radius:50%;border:3px solid var(--acc,var(--coral));box-shadow:0 0 12px var(--acc,var(--coral));transition:border-color .4s,box-shadow .4s}
.lang{display:flex;gap:2px;padding:2px;border-radius:999px;background:rgba(255,255,255,.08)}
.lang button{appearance:none;border:0;background:none;color:var(--ink);font:600 13px/1 Inter,sans-serif;min-width:44px;height:44px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.lang button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.prog{position:fixed;left:0;top:0;width:100%;height:2px;z-index:31;background:var(--acc,var(--coral));transform-origin:0 0;transform:scaleX(0)}

#story{position:relative;height:1912vh}
.stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden}
.beams{position:absolute;inset:0;z-index:0;pointer-events:none}
.beams i{position:absolute;top:-12vh;width:40vw;height:130vh;transform-origin:50% 0;clip-path:polygon(47% 0,53% 0,100% 100%,0 100%);background:linear-gradient(rgba(255,90,60,.26),rgba(255,90,60,0) 72%);animation:sway 9s ease-in-out infinite alternate}
.beams i.c{background:linear-gradient(rgba(67,217,255,.17),rgba(67,217,255,0) 70%);animation-duration:11s}
.horizon{position:absolute;inset:auto 0 0;height:50vh;z-index:0;background:radial-gradient(70% 75% at 50% 100%,rgba(255,90,60,.32),rgba(255,90,60,0) 70%)}
/* hero: the wordmark never sits under the band. Wide = text column on the left, band on the right (where the features continue);
   phone = wordmark on top, band in the middle, tagline below. --hy lifts the text as you start scrolling. */
.hero-t{position:absolute;left:max(6vw,24px);top:50%;z-index:1;margin:0;font-weight:800;font-size:clamp(72px,10.5vw,190px);line-height:.82;letter-spacing:-.055em;
  background:linear-gradient(172deg,#fff8f2 38%,#ffb39f 78%,#ff6a4a 118%);-webkit-background-clip:text;background-clip:text;color:transparent;
  transform:translateY(calc(-100% - clamp(10px,1.4vw,22px) + var(--hy,0px)));pointer-events:none}
.hero-f{position:absolute;left:max(6vw,24px);top:50%;z-index:5;width:min(460px,40vw);transform:translateY(var(--hy,0px))}
.eyebrow{display:block;margin:0 0 14px;font:600 12px/1 Inter,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--acc,var(--coral))}
.tag{margin:0 0 10px;max-width:22ch;font:600 clamp(20px,2.1vw,30px)/1.2 Unbounded,Inter,sans-serif;text-wrap:balance}
.sub{margin:0;max-width:34ch;color:var(--mute)}
.hint{display:inline-flex;align-items:center;gap:10px;margin-top:22px;font-size:13px;color:var(--mute)}
.hint::before{content:"";width:1px;height:28px;background:linear-gradient(var(--mute),transparent);animation:drip 1.8s ease-in-out infinite}
.crowd{position:absolute;left:0;bottom:0;width:100%;height:24vh;z-index:3;fill:#040203;stroke:#040203;pointer-events:none}
.dimB{position:absolute;inset:auto 0 0;height:46%;z-index:3;opacity:0;pointer-events:none;background:linear-gradient(rgba(11,8,9,0),var(--bg) 62%)}

.caps{position:absolute;z-index:4;left:max(6vw,24px);top:50%;width:min(440px,36vw);height:0}
.cap{position:absolute;left:0;right:0;top:0;opacity:0;pointer-events:none;transform:translateY(calc(-50% + 18px));transition:opacity .5s ease,transform .6s cubic-bezier(.2,.7,.2,1)}
.cap.on{opacity:1;pointer-events:auto;transform:translateY(-50%)}
.cap .eyebrow{color:var(--a,var(--coral))}
/* colour picker in the last chapter: tapping a swatch re-dyes the 3D strap */
.pk{display:flex;gap:12px;margin-top:22px}
.pk button{appearance:none;width:44px;height:44px;border-radius:50%;border:0;padding:0;cursor:pointer;background:var(--c);box-shadow:inset 0 -6px 10px rgba(0,0,0,.25),0 0 0 2px var(--bg),0 0 0 2px rgba(255,255,255,0);transition:transform .25s,box-shadow .25s}
.pk button[aria-pressed=true]{transform:scale(1.08);box-shadow:inset 0 -6px 10px rgba(0,0,0,.25),0 0 0 3px var(--bg),0 0 0 5px var(--ink)}
.pk button:focus-visible,.rail button:focus-visible,.cols button:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
/* chapter rail: where you are in the story, tap to jump */
.rail{position:absolute;z-index:6;right:max(2.2vw,12px);top:50%;display:flex;flex-direction:column;transform:translateY(-50%);opacity:0;pointer-events:none;transition:opacity .4s}
.rail.on{opacity:1;pointer-events:auto}
.rail button{appearance:none;display:grid;place-items:center;width:30px;height:30px;padding:0;border:0;background:none;cursor:pointer}
.rail button::before{content:"";width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.26);transition:height .35s,width .35s,background .35s}
.rail button:hover::before{background:rgba(255,255,255,.6)}
.rail button[aria-current=step]::before{height:22px;background:var(--ink)}
.cap h2{margin:0 0 14px;font-weight:600;font-size:clamp(30px,3.3vw,48px);line-height:1.05;letter-spacing:-.02em;text-wrap:balance}
.cap p{margin:0;max-width:36ch;font-size:17px;color:var(--mute)}

.view{position:absolute;inset:0;z-index:2;pointer-events:none;perspective:calc(var(--k)*1800px)}
.pos{position:absolute;left:50%;top:50%;transform-style:preserve-3d;will-change:transform}
.haloL{position:absolute;left:50%;top:50%;z-index:1;pointer-events:none;will-change:transform}
.gl{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity .7s}
.gl.on{opacity:1}.gl canvas{display:block;width:100%;height:100%}
.view{z-index:2}
.halo{position:absolute;left:calc(var(--k)*-400px);top:calc(var(--k)*-400px);width:calc(var(--k)*800px);height:calc(var(--k)*800px);border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--ring) 60%,transparent),transparent);opacity:.2;transition:opacity .6s}
.glowing .halo{opacity:.5}
.bz{position:absolute;transform-style:preserve-3d}
.bz.go{animation:bz .45s linear}
.watch{position:absolute;left:0;top:0;transform-style:preserve-3d;will-change:transform;--D:calc(var(--k)*260px);--R:calc(var(--k)*130px);--T:calc(var(--k)*46px);--W:calc(var(--k)*128px);--ts:calc(var(--k)*14px)}
.webgl .face{background:none}.webgl .ringl,.webgl .back,.webgl .btn{display:none}.webgl .shade{inset:calc(var(--k)*17px)}
/* WebGL draws the black sapphire glass with real reflections, so the HTML screen only carries the UI; keep a fainter CSS sheen on top */
.webgl .screen{background:none}.webgl .glass{opacity:calc(.4 - .4*var(--gs,0))}
/* CSS fallback strap follows the picked colour */
.watch.tint .sf,.watch.tint .sl,.watch.tint .sr{filter:hue-rotate(var(--hr,0deg)) saturate(var(--sa,1))}
.st,.face,.back,.btn,.sf,.sb,.sl,.sr{position:absolute;display:block;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.st{width:calc(var(--D)*.02618 + 1px);height:var(--T);left:calc((var(--D)*.0785 + 1px)/-2);top:calc(var(--T)/-2);transform:rotateZ(var(--a)) translateY(calc(var(--R)*-1 + .5px)) rotateX(90deg)}
.face{width:var(--D);height:var(--D);left:calc(var(--R)*-1);top:calc(var(--R)*-1);border-radius:50%;transform:translateZ(calc(var(--T)/2 + .5px));background:conic-gradient(from calc(var(--spec,0)*1deg),#35343a,#87858d 10%,#2b2a30 28%,#5d5b62 50%,#26252b 70%,#79777f 88%,#35343a)}
.ringl{position:absolute;inset:calc(var(--k)*7px);border-radius:50%;border:calc(var(--k)*3.5px) solid var(--ring);opacity:.55;transition:opacity .5s,box-shadow .5s,border-color .5s}
.glow .ringl{opacity:1;box-shadow:0 0 calc(var(--k)*10px) var(--ring),0 0 calc(var(--k)*22px) var(--ring),inset 0 0 calc(var(--k)*10px) var(--ring)}
.screen{position:absolute;inset:calc(var(--k)*17px);border-radius:50%;background:#000;overflow:hidden;box-shadow:0 0 0 calc(var(--k)*2px) #09090b}
.glass{position:absolute;inset:0;z-index:5;border-radius:50%;pointer-events:none;background:linear-gradient(140deg,rgba(255,255,255,.15),rgba(255,255,255,0) 38%),radial-gradient(120% 80% at 100% 120%,rgba(255,255,255,.06),transparent 60%)}
.shade{position:absolute;inset:0;z-index:6;border-radius:50%;background:#000;opacity:var(--fs,0)}
.back{width:var(--D);height:var(--D);left:calc(var(--R)*-1);top:calc(var(--R)*-1);border-radius:50%;transform:rotateY(180deg) translateZ(calc(var(--T)/2 + .5px));background:radial-gradient(circle,#2b2b30 0 22%,#0f0f12 23% 26%,#1c1c21 27% 60%,#121215 61%)}
.btn{width:calc(var(--k)*24px);height:calc(var(--k)*60px);left:calc(var(--k)*-12px);top:calc(var(--k)*-30px);border-radius:calc(var(--k)*12px);transform:translateX(calc(var(--R) + var(--k)*2.5px)) rotateY(90deg);background:linear-gradient(90deg,#b8341d,#ff6a4a 50%,#b8341d);transition:box-shadow .4s,background .4s}
.sos .btn{background:#ff8a6c;box-shadow:0 0 calc(var(--k)*14px) #ff5a3c,0 0 calc(var(--k)*40px) #ff5a3c}
.seg{position:absolute;left:calc(var(--W)/-2);top:0;width:var(--W);transform-style:preserve-3d}
.sf{left:0;right:0;top:0;bottom:0;transform:translateZ(calc(var(--ts)/2));background:linear-gradient(90deg,#a12c18,#e44e2e 8%,#ff6446 28%,#ff7656 50%,#ff6446 72%,#e44e2e 92%,#a12c18)}
.sl,.sr{top:0;bottom:0;width:var(--ts);background:linear-gradient(90deg,#6a1c0e,#b33722 50%,#6a1c0e)}
.sl{left:calc(var(--ts)/-2);transform:rotateY(-90deg)}
.sr{left:calc(var(--W) - var(--ts)/2);transform:rotateY(90deg)}
.sf::after,.sl::after,.sr::after{content:"";position:absolute;inset:0;background:#0b0809;opacity:var(--o,0)}

/* screens: drawn at 228px design size, scaled by --k. One system on every screen:
   a small coloured label (.we), one big value (.wb / .wm / .nd), one quiet line (.ws). Thin arcs, no clutter. */
.scr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;opacity:0;transform:scale(.94);transition:opacity .45s ease,transform .5s cubic-bezier(.2,.7,.2,1);--a:rgba(255,255,255,.72)}
.scr.on{opacity:1;transform:none}
.we{margin-bottom:calc(var(--k)*8px);font:600 calc(var(--k)*12px)/1 Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--a)}
.wb{font:600 calc(var(--k)*51px)/1 Unbounded,Inter,sans-serif;letter-spacing:-.05em}
.wm{font:600 calc(var(--k)*24px)/1.1 Unbounded,Inter,sans-serif;letter-spacing:-.02em;min-height:1.1em}
.ws{font:500 calc(var(--k)*16px)/1.25 Inter,sans-serif;color:rgba(255,255,255,.72)}
.dim{color:rgba(255,255,255,.46)}
.edge{position:absolute;inset:0;width:100%;height:100%}
.edge circle{fill:none;stroke-width:3.5}
.trk{stroke:rgba(255,255,255,.08)}
.val{stroke-linecap:round;transition:stroke-dasharray .3s}
.av{display:inline-grid;place-items:center;width:calc(var(--k)*26px);height:calc(var(--k)*26px);border-radius:50%;background:var(--c);color:#14100e;font:700 calc(var(--k)*12px)/1 Inter,sans-serif;font-style:normal}
.row{display:flex;align-items:center;gap:calc(var(--k)*8px);margin-top:calc(var(--k)*14px)}
.stack .av{box-shadow:0 0 0 calc(var(--k)*2px) #000}.stack .av+.av{margin-left:calc(var(--k)*-9px)}
.radar{position:absolute;inset:0;border-radius:50%;background:repeating-radial-gradient(circle,transparent 0 calc(var(--k)*37px),rgba(255,255,255,.1) calc(var(--k)*37px) calc(var(--k)*38px)),radial-gradient(circle,rgba(67,217,255,.13),transparent 70%)}
.radar::before,.radar::after{content:"";position:absolute;background:rgba(255,255,255,.06)}
.radar::before{left:50%;top:0;bottom:0;width:1px}.radar::after{top:50%;left:0;right:0;height:1px}
.sweep{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 280deg,rgba(67,217,255,.4) 360deg);animation:spin 3.2s linear infinite}
.me{position:absolute;left:50%;top:50%;width:calc(var(--k)*12px);height:calc(var(--k)*12px);margin:calc(var(--k)*-6px);border-radius:50%;background:#fff;box-shadow:0 0 0 calc(var(--k)*5px) rgba(255,255,255,.16)}
.fr{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);width:calc(var(--k)*28px);height:calc(var(--k)*28px);font-size:calc(var(--k)*13px)}
.fr::after{content:"";position:absolute;inset:calc(var(--k)*-6px);border-radius:50%;border:calc(var(--k)*2px) solid var(--c);opacity:0;animation:pulse 2.4s ease-out infinite;animation-delay:var(--dl)}
.fr.hi{width:calc(var(--k)*34px);height:calc(var(--k)*34px);font-size:calc(var(--k)*15px)}
.rl{position:absolute;left:0;right:0;bottom:calc(var(--k)*24px)}
.rl b{color:#fff}
.ntop{display:flex;justify-content:center;align-items:center;gap:calc(var(--k)*7px);font:600 calc(var(--k)*15px)/1 Inter,sans-serif}
.ar{position:relative;width:calc(var(--k)*62px);height:calc(var(--k)*62px);margin:calc(var(--k)*10px) 0 calc(var(--k)*6px)}
.ar svg{width:100%;height:100%;fill:var(--cyan);transition:transform .3s,opacity .3s}
.ping{position:absolute;inset:calc(var(--k)*4px);border-radius:50%;background:var(--cyan);opacity:0}
.near .ar svg{opacity:0;transform:scale(.4)}
.near .ping{animation:ping 1.1s ease-out infinite}
.nd{display:flex;align-items:baseline;justify-content:center;gap:calc(var(--k)*4px)}
.nd b{font:600 calc(var(--k)*48px)/1 Unbounded,Inter,sans-serif;letter-spacing:-.04em}
.nd span{font:500 calc(var(--k)*17px)/1 Inter,sans-serif;color:rgba(255,255,255,.6)}
.s2 .ws{margin-top:calc(var(--k)*6px);font-size:calc(var(--k)*14px)}
.bump{position:relative;width:calc(var(--k)*156px);height:calc(var(--k)*76px);margin-bottom:calc(var(--k)*12px);--g:0px}
.bb{position:absolute;top:calc(var(--k)*6px);width:calc(var(--k)*64px);height:calc(var(--k)*64px);border-radius:50%;display:grid;place-items:center;font:700 calc(var(--k)*16px)/1 Inter,sans-serif;font-style:normal;color:#14100e;transition:transform .3s}
.bb.a{left:0;background:var(--coral);transform:translateX(var(--g))}
.bb.b{right:0;background:var(--lime);transform:translateX(calc(var(--g)*-1))}
.burst{position:absolute;left:calc(50% - var(--k)*42px);top:calc(var(--k)*-4px);width:calc(var(--k)*84px);height:calc(var(--k)*84px);border-radius:50%;border:calc(var(--k)*3px) solid #fff;opacity:0}
.ok .burst{animation:ring 1s ease-out infinite}
.s3 .ws{margin-top:calc(var(--k)*4px)}
.chips{display:flex;justify-content:center;gap:calc(var(--k)*8px);margin-bottom:calc(var(--k)*14px)}
.chip{display:grid;place-items:center;width:calc(var(--k)*38px);height:calc(var(--k)*38px);border-radius:50%;background:rgba(255,255,255,.1);font:700 calc(var(--k)*11px)/1 Inter,sans-serif;font-style:normal;transition:background .3s,color .3s}
.chip svg{width:calc(var(--k)*20px);height:calc(var(--k)*20px);fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chip.on{background:var(--sun);color:#14100e}
.s4 .nd{margin:calc(var(--k)*6px) 0 calc(var(--k)*6px)}
.s4 .nd svg{width:calc(var(--k)*20px);height:calc(var(--k)*20px);fill:var(--sun);align-self:center;transition:transform .4s}
.s4 .ws{font-size:calc(var(--k)*14px)}
.eq{display:flex;align-items:flex-end;gap:calc(var(--k)*5px);height:calc(var(--k)*22px);margin:calc(var(--k)*12px) 0}
.eq i{width:calc(var(--k)*6px);height:100%;border-radius:calc(var(--k)*3px);background:var(--sun);transform-origin:50% 100%;animation:eq .8s ease-in-out infinite alternate;animation-delay:calc(var(--i)*-.19s)}
.s5 .ws{font-size:calc(var(--k)*14px)}
.sw{position:absolute;left:50%;top:50%;width:calc(var(--k)*20px);height:calc(var(--k)*20px);margin:calc(var(--k)*-10px);border-radius:50%;background:var(--c);transform:rotate(var(--a)) translateY(calc(var(--k)*-84px));transition:transform .35s,box-shadow .35s}
.sw.on{transform:rotate(var(--a)) translateY(calc(var(--k)*-84px)) scale(1.5);box-shadow:0 0 0 calc(var(--k)*3px) #000,0 0 0 calc(var(--k)*5px) var(--c)}
.s6::before{content:"";position:absolute;inset:22%;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--ring) 45%,transparent),transparent)}
.s6 .wm{color:var(--ring);position:relative;font-size:calc(var(--k)*28px)}.s6 .we{position:relative}
.s7{background:radial-gradient(circle,#3a0f07,#000 72%);transition:opacity .45s,transform .5s,background .5s}
.s7.sent{background:radial-gradient(circle,#ff6a4a 0,#a3240f 58%,#2a0703 100%)}
.sr2{position:absolute;inset:18%;border-radius:50%;border:calc(var(--k)*2px) solid rgba(255,120,90,.8);animation:ring 2s ease-out infinite}
.sr2+.sr2{animation-delay:-1s}
.s7 .wb{position:relative;font-size:calc(var(--k)*54px)}
.s7 .ws{position:relative;margin-top:calc(var(--k)*10px);max-width:80%}
.s7 .dim{margin-top:calc(var(--k)*4px);font-size:calc(var(--k)*14px);color:rgba(255,255,255,.75)}
.s8{--a:var(--acc,var(--coral))}
.s8 .we{font-size:calc(var(--k)*13px)}

.band{padding:clamp(56px,9vw,120px) max(5vw,20px)}
.wrap{max-width:1240px;margin:0 auto}
.sec{margin:0 0 clamp(32px,5vw,56px);max-width:20ch;font-weight:600;font-size:clamp(30px,4vw,52px);line-height:1.05;letter-spacing:-.02em;text-wrap:balance}
.hw{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(28px,4vw,56px)}
.hw svg{width:44px;height:44px;fill:none;stroke:var(--coral);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.hw h3{margin:18px 0 8px;font-weight:600;font-size:20px;line-height:1.2}
.hw p{margin:0;color:var(--mute);max-width:38ch}
.end{text-align:center;background:radial-gradient(60% 80% at 50% 100%,rgba(255,90,60,.2),transparent 70%)}
.end h2{margin:0 auto 14px;max-width:18ch;font-weight:800;font-size:clamp(32px,5.4vw,60px);line-height:1.05;letter-spacing:-.03em;text-wrap:balance}
.end p{margin:0 auto;color:var(--mute);max-width:40ch}
.cols{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(20px,4vw,48px);margin:44px 0 0;padding:0;list-style:none}
.cols button{appearance:none;display:flex;flex-direction:column;align-items:center;gap:12px;padding:8px;border:0;border-radius:14px;background:none;color:var(--mute);font:500 14px/1 Inter,sans-serif;cursor:pointer;transition:color .3s}
.cols button:hover,.cols button[aria-pressed=true]{color:var(--ink)}
.mini{position:relative;width:56px;height:100px;transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.cols button:hover .mini,.cols button[aria-pressed=true] .mini{transform:translateY(-6px)}
.mini::before{content:"";position:absolute;left:16px;width:24px;top:0;bottom:0;border-radius:9px;background:var(--c)}
.mini::after{content:"";position:absolute;left:4px;top:26px;width:48px;height:48px;border-radius:50%;background:radial-gradient(circle,#050505 0 60%,#3c3b41 62%);box-shadow:0 0 0 3px var(--c)}
footer{padding:28px max(5vw,20px) 40px;border-top:1px solid rgba(255,255,255,.08);color:var(--mute);font-size:13px;text-align:center}

@keyframes spin{to{transform:rotate(1turn)}}
@keyframes pulse{0%{transform:scale(.7);opacity:.9}100%{transform:scale(1.9);opacity:0}}
@keyframes ping{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.25);opacity:0}}
@keyframes ring{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.3);opacity:0}}
@keyframes eq{from{transform:scaleY(.25)}to{transform:scaleY(1)}}
@keyframes sway{from{transform:rotate(var(--r0))}to{transform:rotate(var(--r1))}}
@keyframes drip{0%{transform:scaleY(0);transform-origin:50% 0}50%{transform:scaleY(1);transform-origin:50% 0}51%{transform-origin:50% 100%}100%{transform:scaleY(0);transform-origin:50% 100%}}
@keyframes bz{0%,100%{transform:none}20%{transform:translateX(calc(var(--k)*-5px))}40%{transform:translateX(calc(var(--k)*5px))}60%{transform:translateX(calc(var(--k)*-4px))}80%{transform:translateX(calc(var(--k)*3px))}}

@media (max-width:760px){
  .hero-t{left:0;right:0;top:calc(62px + 2.5vh);text-align:center;font-size:min(25vw,14vh);transform:translateY(var(--hy,0px))}
  .hero-f{left:16px;right:16px;top:auto;bottom:max(6vh,24px);width:auto;text-align:center;transform:none;text-shadow:0 2px 24px var(--bg)}
  .tag,.sub{margin-left:auto;margin-right:auto}
  .hint{margin-top:14px}
  .rail{right:auto;left:50%;top:60px;flex-direction:row;transform:translateX(-50%)}
  .rail button{width:26px;height:32px}
  .rail button[aria-current=step]::before{height:6px;width:20px}
  .pk{justify-content:center;margin-top:16px}
  .caps{left:20px;right:20px;top:auto;bottom:max(5vh,22px);width:auto}
  .cap{top:auto;bottom:0;transform:translateY(18px);text-align:center}
  .cap.on{transform:none}
  .cap h2{font-size:clamp(23px,6.6vw,30px);margin-bottom:10px}
  .cap p{font-size:16px;margin:0 auto}
  .hw{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01ms!important}}

function caseGeometry(){

  const top=[];arc(119,7,11.2,16.2,0,Math.PI/2,22,top);top.push(V(116.5,23.2),V(114.6,23.2),V(113.6,22.4));

}
function loopGeometry(){

  const face=(x0,y0,x1,y1,nx,ny)=>{for(let k=1;k<NF;k++){const f=k/NF;sec.push([x0+(x1-x0)*f,y0+(y1-y0)*f,nx,ny,1])}};

        il=Math.hypot(Y,Z+b)||1,inw=Math.max(0,-(ny*an*Y+nz*an*(Z+b))/il),o=sh*(1-.6*Math.exp(-cd/24))*(1-.32*inw);

  g.addColorStop(.925,'rgba(255,255,255,.3)');g.addColorStop(.975,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,512,512);
